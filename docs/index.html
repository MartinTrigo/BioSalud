<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00702f">
  <title>BioSalud ECOMARCAL</title>
  <meta name="description" content="Salud del suelo y de los cultivos. Plan de aplicaciones, seguimiento y monitoreo de campo para productores del sello agroecológico ECOMARCAL. IFAB (CONICET / INTA El Bolsón), Comarca Andina del Paralelo 42.">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono-192.png">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <!-- El logo del IFAB ya es un conjunto: trae CONICET, INTA y la sigla del
         instituto, así que no hacen falta los tres sueltos. Si algún archivo
         faltara, se muestra la sigla en texto en vez de una imagen rota
         (ver img/LEEME.md). -->
    <div class="logos">
      <span class="logo logo--ifab" data-sigla="IFAB · CONICET / INTA"><img src="img/logo-ifab.png"
            alt="IFAB · CONICET / INTA"
            onerror="this.parentNode.classList.add('logo--texto'); this.remove();"></span>
      <span class="logo logo--sello" data-sigla="ECOMARCAL"><img src="img/logo-ecomarcal.jpg" alt="Sello ECOMARCAL"
            onerror="this.parentNode.classList.add('logo--texto'); this.remove();"></span>
    </div>

    <div class="barra">
      <button class="volver" id="btn-volver" hidden aria-label="Volver al inicio">&#8592;</button>
      <div class="barra__texto">
        <h1 id="titulo-vista">BioSalud</h1>
        <p id="subtitulo-vista">Salud del suelo y los cultivos</p>
      </div>
    </div>
  </header>

  <main id="vista" class="vista">
    <p class="cargando">Cargando&hellip;</p>
  </main>

  <footer class="pie">
    <p><strong>BioSalud ECOMARCAL</strong></p>
    <p>IFAB (CONICET / INTA El Bolsón) &middot; Comarca Andina del Paralelo 42</p>
    <p class="pie__version" id="pie-version"></p>
  </footer>

  <noscript>
    <p class="aviso aviso--error">Esta aplicación necesita JavaScript activado para funcionar.</p>
  </noscript>

  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
