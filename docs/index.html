<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00702f">
  <title>BioSalud ECOMARCAL</title>
  <meta name="description" content="Salud del suelo y de los cultivos. Plan de aplicaciones, seguimiento y monitoreo de campo para productores del sello agroecológico ECOMARCAL. IFAB (CONICET / INTA El Bolsón), Comarca Andina del Paralelo 42.">

  <!-- La app no carga nada de afuera: ni tipografías, ni librerías, ni imágenes
       de otros sitios. Eso permite declarar de dónde puede venir cada cosa y
       que el navegador rechace todo lo demás. Si alguna vez se colara un script
       ajeno, no llega a ejecutarse. Lo único externo permitido es el servicio de
       las planillas de Google, que es a donde se envían los registros. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    manifest-src 'self';
    connect-src 'self' https://script.google.com https://script.googleusercontent.com;
    base-uri 'none';
    form-action 'none';
    object-src 'none'">

  <!-- Al abrir un enlace externo no se le cuenta de dónde salió. -->
  <meta name="referrer" content="no-referrer">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono-192.png">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <!-- El logo del IFAB ya es un conjunto: trae CONICET, INTA y la sigla del
         instituto, así que no hacen falta los tres sueltos. Si algún archivo
         faltara, se muestra la sigla en texto en vez de una imagen rota
         (ver img/LEEME.md). -->
    <div class="logos">
      <span class="logo logo--ifab" data-sigla="IFAB · CONICET / INTA">
        <img src="img/logo-ifab.png" alt="IFAB · CONICET / INTA"></span>
      <span class="logo logo--sello" data-sigla="ECOMARCAL">
        <img src="img/logo-ecomarcal.jpg" alt="Sello ECOMARCAL"></span>
    </div>

    <div class="barra">
      <button class="volver" id="btn-volver" hidden aria-label="Volver al inicio">&#8592;</button>
      <div class="barra__texto">
        <h1 id="titulo-vista">BioSalud</h1>
        <p id="subtitulo-vista">Salud del suelo y los cultivos</p>
      </div>
    </div>
  </header>

  <main id="vista" class="vista">
    <p class="cargando">Cargando&hellip;</p>
  </main>

  <footer class="pie">
    <p><strong>BioSalud ECOMARCAL</strong></p>
    <p>IFAB (CONICET / INTA El Bolsón) &middot; Comarca Andina del Paralelo 42</p>
    <p class="pie__version" id="pie-version"></p>
  </footer>

  <noscript>
    <p class="aviso aviso--error">Esta aplicación necesita JavaScript activado para funcionar.</p>
  </noscript>

  <script src="js/util.js"></script>
  <script src="js/acceso.js"></script>
  <script src="js/db.js"></script>
  <script src="js/envio.js"></script>
  <script src="js/terminos.js"></script>
  <script src="js/config.js"></script>
  <script src="js/wiki.js"></script>
  <script src="js/cobre.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/seguimiento.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
